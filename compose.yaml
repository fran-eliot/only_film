services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onlyfilm}
      POSTGRES_USER: ${POSTGRES_USER:-onlyfilm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onlyfilm} -d ${POSTGRES_DB:-onlyfilm}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
