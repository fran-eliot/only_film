name: SonarCloud Analysis

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  sonar:
    name: Build + Tests + Coverage + SonarCloud
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: onlyfilm
          POSTGRES_USER: onlyfilm
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onlyfilm -d onlyfilm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DB_URL: jdbc:postgresql://localhost:5432/onlyfilm
      DB_USERNAME: onlyfilm
      DB_PASSWORD: ci-only-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Sonar necesita el historial (blame / new code)

      - name: Setup Java 25 + cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Cache de paquetes SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # 'verify' corre TODA la suite (incl. Selenium headless gracias a CI=true) -> JaCoCo genera el xml
      # -> 'sonar' lo lee y sube cobertura + nº de tests + análisis estático.
      - name: Build + tests + JaCoCo + análisis Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar