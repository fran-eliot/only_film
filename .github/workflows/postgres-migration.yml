name: PostgreSQL schema and regression validation

on:
  push:
    branches:
      - feature/postgresql-flyway
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h2-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run existing H2 regression tests
        run: mvn -B -ntp test -Dtest='*RepositoryTest,*ServiceTest,*ControllerTest,*SecurityConfigTest,TicketSecurityRegressionTest,TicketCheckoutRegressionTest,TicketCheckoutConcurrencyTest' -DrerunFailingTestsCount=0

  postgres-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: onlyfilm
          POSTGRES_USER: onlyfilm
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onlyfilm -d onlyfilm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Package application
        run: mvn -B -ntp package -DskipTests
      - name: Validate migration, persistent data and restart
        env:
          SPRING_PROFILES_ACTIVE: postgres
          DB_URL: jdbc:postgresql://localhost:5432/onlyfilm
          DB_USERNAME: onlyfilm
          DB_PASSWORD: ci-only-password
        run: |
          set -euo pipefail
          PG_CONTAINER=$(docker ps -q --filter ancestor=postgres:17-alpine | head -n 1)
          test -n "$PG_CONTAINER"
          sql() {
            docker exec "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U onlyfilm -d onlyfilm -Atc "$1"
          }
          APP_PID=""
          stop_app() {
            if [ -n "$APP_PID" ]; then
              kill "$APP_PID" 2>/dev/null || true
              wait "$APP_PID" 2>/dev/null || true
              APP_PID=""
            fi
          }
          trap 'stop_app; cat /tmp/onlyfilm-postgres.log || true' EXIT
          start_app() {
            java -jar target/*.jar > /tmp/onlyfilm-postgres.log 2>&1 &
            APP_PID=$!
            for i in $(seq 1 60); do
              if ! kill -0 "$APP_PID" 2>/dev/null; then
                echo "Application terminated during startup"
                exit 1
              fi
              CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/movies || true)
              if [ "$CODE" = "200" ]; then
                return 0
              fi
              sleep 2
            done
            echo "Application did not become ready"
            exit 1
          }

          start_app
          test "$(sql 'SELECT COUNT(*) FROM flyway_schema_history WHERE version = '\''1'\'' AND success = true')" = "1"
          sql "INSERT INTO movies (title, active) VALUES ('CI persistence probe', true)"
          test "$(sql "SELECT COUNT(*) FROM movies WHERE title = 'CI persistence probe'")" = "1"
          stop_app
          # Restart PostgreSQL itself; its data directory must survive container restart.
          docker restart "$PG_CONTAINER"
          for i in $(seq 1 30); do
            if docker exec "$PG_CONTAINER" pg_isready -U onlyfilm -d onlyfilm >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec "$PG_CONTAINER" pg_isready -U onlyfilm -d onlyfilm

          # A second Spring Boot startup must neither reapply V1 nor erase stored data.
          start_app
          test "$(sql "SELECT COUNT(*) FROM movies WHERE title = 'CI persistence probe'")" = "1"
          test "$(sql 'SELECT COUNT(*) FROM flyway_schema_history WHERE version = '\''1'\'' AND success = true')" = "1"
          echo "PASS: Flyway history and PostgreSQL data survived application restart"
