name: Selenium review headless regression

on:
  pull_request:
  workflow_dispatch:

jobs:
  review-selenium:
    name: Review Selenium (Chrome headless)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Run ReviewSeleniumTest without retries
        env:
          CI: 'true'
        run: mvn -B -ntp test -Dtest=ReviewSeleniumTest -DrerunFailingTestsCount=0

      - name: Upload Selenium failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: selenium-review-failure-evidence
          path: |
            target/surefire-reports/
            target/screenshots/
          if-no-files-found: warn
          retention-days: 7
