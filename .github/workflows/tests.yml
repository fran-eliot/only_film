name: Tests (manual + validación Selenium en PR)

# La batería completa se ejecuta manualmente. Solo Selenium se ejecuta en PR
# cuando cambia este workflow, para validar su configuración antes del merge.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/tests.yml'

jobs:
  repository-tests:
    if: github.event_name == 'workflow_dispatch'
    name: Tests de repositorios (@DataJpaTest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25 + cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Ejecutar *RepositoryTest
        run: mvn -B test -Dtest='*RepositoryTest'

  controller-tests:
    if: github.event_name == 'workflow_dispatch'
    name: Tests de controllers (@SpringBootTest + MockMvc)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25 + cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Ejecutar *ControllerTest
        run: mvn -B test -Dtest='*ControllerTest'

  service-tests:
    if: github.event_name == 'workflow_dispatch'
    name: Tests de servicios (Unitarios con mocks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 25 + cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Ejecutar *ServiceTest
        run: mvn -B test -Dtest='*ServiceTest'


  security-tests:
    if: github.event_name == 'workflow_dispatch'
    name: Tests de seguridad (rutas SecurityConfig)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 25 + cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Ejecutar *SecurityTest
        run: mvn -B test -Dtest='*SecurityConfigTest'

  selenium-tests:
    name: Tests de Selenium E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 25 + cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Versión de Chrome del runner
        run: google-chrome --version
      # Selección fija de las cinco clases E2E existentes, sin entrada manual indefinida.
      - name: Ejecutar tests de Selenium
        run: mvn -B -ntp test -Dtest='*SeleniumTest' -Dsurefire.rerunFailingTestsCount=0
        # opcional, para ver más detalles
      - name: Subir reporte de Selenium a GitHub Actions
        if: always() # Siempre subir el reporte, incluso si los tests fallan
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7
      - name: Subir capturas de fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-screenshots
          path: 'target/screenshots/'
          retention-days: 7
