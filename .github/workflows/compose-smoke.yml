name: Full-stack Docker Compose smoke test

on:
  push:
    branches:
      - feature/fullstack-compose
      - feature/persistent-uploads
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_DB: onlyfilm
      POSTGRES_USER: onlyfilm
      POSTGRES_PASSWORD: ci-compose-only-password
      APP_PORT: "8080"
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start Spring Boot and PostgreSQL
        run: docker compose up --build --wait -d
      - name: Verify web startup, migrations and durable data
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose logs --no-color --tail=150' EXIT
          for i in $(seq 1 90); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/movies || true)
            if [ "$CODE" = "200" ]; then break; fi
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/movies)" = "200"
          sql() {
            docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U onlyfilm -d onlyfilm -Atc "$1"
          }
          test "$(sql "SELECT COUNT(*) FROM flyway_schema_history WHERE version='1' AND success=true")" = "1"
          sql "INSERT INTO movies (title, active) VALUES ('Compose persistence probe', true)"
          docker compose exec -T app sh -c "printf 'upload-persistence-probe' > /app/uploads/ci-persistence.txt"
          test "$(curl -fsS http://127.0.0.1:8080/uploads/ci-persistence.txt)" = "upload-persistence-probe"
          docker compose restart postgres app
          for i in $(seq 1 90); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/movies || true)
            if [ "$CODE" = "200" ]; then break; fi
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/movies)" = "200"
          test "$(sql "SELECT COUNT(*) FROM movies WHERE title='Compose persistence probe'")" = "1"
          test "$(sql "SELECT COUNT(*) FROM flyway_schema_history WHERE version='1' AND success=true")" = "1"
          docker compose up --force-recreate -d app
          for i in $(seq 1 90); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/movies || true)" = "200" ]; then break; fi
            sleep 2
          done
          test "$(curl -fsS http://127.0.0.1:8080/uploads/ci-persistence.txt)" = "upload-persistence-probe"
          echo "PASS: uploaded content survives application container recreation"
          echo "PASS: web 200, Flyway V1, data preserved after Compose restart"
      - name: Clean up Compose
        if: always()
        run: docker compose down --remove-orphans
