spring.application.name=g1_testing
spring.application.version=2.0
spring.application.title=Only Film
spring.datasource.url=jdbc:h2:mem:cine_testing_db
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
spring.jpa.show-sql=false
spring.thymeleaf.cache=true
spring.servlet.multipart.max-file-size=10MB
spring.output.ansi.enabled=ALWAYS
# Flyway only runs in the PostgreSQL profile; H2 remains Hibernate-managed.
spring.flyway.enabled=false
