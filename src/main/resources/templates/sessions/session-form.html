<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('Formulario de Proyección — Only Film')}"></head>

<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{layout/navbar :: navbar}"></nav>

<main class="container flex-grow-1 my-4" th:with="isEdit=${proyeccion.id != null}">

    <div class="mb-4">
        <h1 th:text="${isEdit ? 'Editar proyección' : 'Crear nueva proyección'}">Formulario de Proyección</h1>
        <p class="text-secondary mb-0" th:text="${isEdit ? 'Actualiza los detalles de la proyección' : 'Rellena los datos para crear una nueva proyección'}"></p>
    </div>

    <div class="card mb-5">
        <div class="card-body">
            <form th:action="@{/sessions}" th:object="${proyeccion}" method="POST">

                <!-- ID oculto si es edición -->
                <input type="hidden" th:if="${isEdit}" th:field="*{id}">

                <!-- Fila 1: Película y Sala -->
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="movie" class="form-label">
                            <i class="fa-solid fa-film me-2 text-gold"></i>Película <span class="text-danger">*</span>
                        </label>
                        <select id="movie" th:field="*{movieId}" class="form-select" required>
                            <option value="">-- Selecciona una película --</option>
                            <option th:each="movie : ${movies}"
                                    th:value="${movie.id}"
                                    th:text="${movie.title}"
                                    th:selected="${proyeccion.movieId == movie.id}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="room" class="form-label">
                            <i class="fa-solid fa-door-open me-2 text-gold"></i>Sala <span class="text-danger">*</span>
                        </label>
                        <select id="room" th:field="*{roomId}" class="form-select" required>
                            <option value="">-- Selecciona una sala --</option>
                            <option th:each="room : ${rooms}"
                                    th:value="${room.id}"
                                    th:text="${room.name + ' (' + room.screenType + ')'}"
                                    th:selected="${proyeccion.roomId == room.id}">
                            </option>
                        </select>
                    </div>
                </div>

                <!-- Fila 2: Fecha/Hora y Precio -->
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="startTime" class="form-label">
                            <i class="fa-solid fa-calendar me-2 text-gold"></i>Fecha y Hora <span class="text-danger">*</span>
                        </label>
                        <input type="datetime-local" id="startTime" th:field="*{startTime}" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label for="price" class="form-label">
                            <i class="fa-solid fa-euro me-2 text-gold"></i>Precio € <span class="text-danger">*</span>
                        </label>
                        <input type="number" id="price" th:field="*{price}" class="form-control"
                               th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"
                               th:aria-invalid="${#fields.hasErrors('price')}"
                               th:aria-describedby="${#fields.hasErrors('price') ? 'priceError' : null}"
                               min="0" step="0.01" placeholder="12.50" required>
                        <div id="priceError" class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                    </div>
                </div>

                <!-- Fila 3: Idioma y Duración de anuncios -->
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="language" class="form-label">
                            <i class="fa-solid fa-language me-2 text-gold"></i>Idioma
                        </label>
                        <select id="language" th:field="*{language}" class="form-select">
                            <option value="">-- Selecciona idioma --</option>
                            <option value="VO" th:selected="${proyeccion.language == 'VO'}">VO (Original)</option>
                            <option value="VOSE" th:selected="${proyeccion.language == 'VOSE'}">VOSE (Subtítulos)</option>
                            <option value="Doblada" th:selected="${proyeccion.language == 'Doblada'}">Doblada</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="adMinutes" class="form-label">
                            <i class="fa-solid fa-hourglass-end me-2 text-gold"></i>Duración anuncios (min)
                        </label>
                        <input type="number" id="adMinutes" th:field="*{adMinutes}" class="form-control"
                               th:classappend="${#fields.hasErrors('adMinutes')} ? 'is-invalid'"
                               th:aria-invalid="${#fields.hasErrors('adMinutes')}"
                               th:aria-describedby="${#fields.hasErrors('adMinutes') ? 'adMinutesError' : null}"
                               min="0" placeholder="15">
                        <div id="adMinutesError" class="invalid-feedback" th:if="${#fields.hasErrors('adMinutes')}" th:errors="*{adMinutes}"></div>
                    </div>
                </div>

                <!-- Botones de acción -->
                <div class="d-flex gap-2 justify-content-end mt-5">
                    <a th:href="@{/sessions}" class="btn btn-secondary">
                        <i class="fa-solid fa-arrow-left me-1"></i> Volver
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-check me-1"></i>
                        <span th:if="${!isEdit}">Crear proyección</span>
                        <span th:if="${isEdit}">Guardar cambios</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>
</body>
</html>
