<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('Salas — Only Film')}"></head>

<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{layout/navbar :: navbar}"></nav>
<main class="container flex-grow-1 my-4">
    <style>
        /* Asegurar visibilidad de iconos en hover */
        .btn-primary:hover,
        .btn-danger:hover {
            color: white !important;
        }

        .btn-outline-light:hover {
            color: var(--cinema-dark) !important;
        }

        .btn-group-sm .btn {
            padding: 0.375rem 0.5rem !important;
        }

        /* Mejorar spacing en grupo de botones */
        .btn-group-sm .btn i {
            margin: 0 !important;
        }
    </style>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-0">
                <i class="fa-solid fa-door-open me-2 text-gold"></i>Salas
            </h1>
            <p class="text-secondary mb-0">Gestiona las salas del cine</p>
        </div>

        <div class="d-flex gap-2">
            <a th:href="@{/salas/new}" class="btn btn-primary">
                <i class="fa-solid fa-plus me-1"></i> Nueva sala
            </a>
        </div>
    </div>

    <div class="alert alert-info border mb-4">
        <i class="fa-solid fa-info-circle me-2"></i>
        <strong>Administración de salas:</strong> Crea, edita o elimina salas de cine según sea necesario.
    </div>

    <!-- TABLA MEJORADA -->
    <div class="card mb-5">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-dark mb-0">
                    <thead>
                        <tr>
                            <th scope="col" style="width: 8%;">
                                <i class="fa-solid fa-hashtag me-2"></i>ID
                            </th>
                            <th scope="col" style="width: 25%;">
                                <i class="fa-solid fa-door-open me-2"></i>Nombre
                            </th>
                            <th scope="col" style="width: 20%;">
                                <i class="fa-solid fa-people-group me-2"></i>Capacidad
                            </th>
                            <th scope="col" style="width: 20%;">
                                <i class="fa-solid fa-film me-2"></i>Tipo de pantalla
                            </th>
                            <th scope="col" class="text-end" style="width: 27%;">
                                <i class="fa-solid fa-sliders me-2"></i>Acciones
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="room : ${rooms}">
                            <th scope="row" class="align-middle">
                                <span class="badge bg-primary" th:text="${room.id}">1</span>
                            </th>
                            <td class="align-middle">
                                <strong th:text="${room.name != null ? room.name : '(Sin nombre)'}">
                                    (Sin nombre)
                                </strong>
                            </td>
                            <td class="align-middle">
                                <span class="badge badge-secondary">
                                    <i class="fa-solid fa-people-group me-1"></i>
                                    <span th:text="${room.capacity}">0</span>
                                </span>
                            </td>
                            <td class="align-middle">
                                <span class="badge badge-secondary">
                                    <i class="fa-solid fa-film me-1"></i>
                                    <span th:switch="${room.screenType}">
                                        <span th:case="${T(com.demo.model.enums.ScreenType).D4X}">4DX</span>
                                        <span th:case="${T(com.demo.model.enums.ScreenType).IMAX}">IMAX</span>
                                        <span th:case="${T(com.demo.model.enums.ScreenType).D3}">3D</span>
                                        <span th:case="${T(com.demo.model.enums.ScreenType).STANDARD}">Estándar</span>
                                        <span th:case="*">Estándar</span>
                                    </span>
                                </span>
                            </td>
                            <td class="align-middle text-end">
                                <div class="d-flex gap-2 justify-content-end">
                                    <a th:href="@{/salas/{id}(id=${room.id})}"
                                       class="btn btn-outline-light btn-sm"
                                       title="Ver detalles"
                                       data-bs-toggle="tooltip"
                                       data-bs-placement="top">
                                        <i class="fa-solid fa-eye"></i>
                                    </a>

                                    <a th:href="@{/salas/edit/{id}(id=${room.id})}"
                                       class="btn btn-primary btn-sm"
                                       title="Editar sala"
                                       data-bs-toggle="tooltip"
                                       data-bs-placement="top">
                                        <i class="fa-solid fa-pencil"></i>
                                    </a>

                                    <form method="post" th:action="@{/salas/deactivate/{id}(id=${room.id})}" class="d-inline" onsubmit="return confirm('¿Seguro que quieres desactivar esta sala?');"><button type="submit" class="btn btn-danger btn-sm" title="Eliminar sala">
                                        <i class="fa-solid fa-trash"></i>
                                    </button></form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Footer con contador -->
        <div class="card-footer bg-transparent border-top border-secondary d-flex justify-content-between align-items-center">
            <span class="text-muted small">Total de salas</span>
            <span class="badge badge-secondary fs-6" th:text="|${#lists.size(rooms)} resultados|">0 resultados</span>
        </div>
    </div>

</main>
<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>
<script>
    // Inicializar tooltips de Bootstrap
    const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
    const tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl)
    })
</script>
</body>
</html>
