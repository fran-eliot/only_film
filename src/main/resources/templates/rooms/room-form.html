<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('Formulario Sala — Only Film')}"><title>Formulario Sala — Only Film</title></head>

<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{layout/navbar :: navbar}"></nav>
<main class="container flex-grow-1 my-4" th:with="isEdit=${room != null and room.id != null}">

    <div class="mb-4">
        <h1 th:text="${isEdit ? 'Editar sala' : 'Crear sala'}">Formulario Sala</h1>
        <p class="text-secondary mb-0" th:text="${isEdit ? 'Actualiza los datos de la sala' : 'Rellena los datos para crear una nueva sala'}"></p>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <form th:action="@{/salas}" method="post"
                  th:object="${room}">
                <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">
                    Corrige los errores en el formulario antes de guardar.
                </div>
                <input type="hidden" th:field="*{id}">
                

                <div class="mb-4">
                    <label for="name" class="form-label">
                        <i class="fa-solid fa-door-open me-2 text-gold"></i>Nombre de la sala
                    </label>

                    <input type="text"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('name')} ? ' is-invalid' : ''"
                           id="name"
                           name="name"
                           th:field="*{name}"
                           placeholder="Ej: Sala 1"
                           required
                           maxlength="50">
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('name')}"
                         th:errors="*{name}">
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="capacity" class="form-label">
                            <i class="fa-solid fa-people-group me-2 text-gold"></i>Capacidad
                        </label>
                        <input type="number" class="form-control"
                               th:classappend="${#fields.hasErrors('capacity')} ? ' is-invalid' : ''"
                               id="capacity"
                               name="capacity"
                               th:field="*{capacity}"
                               required
                               placeholder="Ej: 100"
                               min="10"
                               max="300">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('capacity')}"

                             th:errors="*{capacity}">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="screenType" class="form-label">
                            <i class="fa-solid fa-film me-2 text-gold"></i>Tipo de pantalla
                        </label>
                        <select class="form-select" id="screenType" name="screenType" th:field="*{screenType}">
                            <option th:value="${T(com.demo.model.enums.ScreenType).STANDARD}"
                                    th:selected="${room.screenType == T(com.demo.model.enums.ScreenType).STANDARD}">Estándar</option>
                            <option th:value="${T(com.demo.model.enums.ScreenType).D3}"
                                    th:selected="${room.screenType == T(com.demo.model.enums.ScreenType).D3}">3D</option>
                            <option th:value="${T(com.demo.model.enums.ScreenType).IMAX}"
                                    th:selected="${room.screenType == T(com.demo.model.enums.ScreenType).IMAX}">IMAX</option>
                            <option th:value="${T(com.demo.model.enums.ScreenType).D4X}"
                                    th:selected="${room.screenType == T(com.demo.model.enums.ScreenType).D4X}">4DX</option>
                        </select>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="floorNumber" class="form-label">
                            <i class="fa-solid fa-building me-2 text-gold"></i>Planta <span class="text-secondary">(opcional)</span>
                        </label>
                        <input type="number" class="form-control" id="floorNumber" name="floorNumber"
                               th:field="*{floorNumber}"
                               th:classappend="${#fields.hasErrors('floorNumber')} ? 'is-invalid'"
                               placeholder="Ej: 0" min="0">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('floorNumber')}" th:errors="*{floorNumber}"></div>
                    </div>
                </div>

                <div class="d-flex gap-2 justify-content-end mt-5">
                    <a th:href="@{/salas}" class="btn btn-secondary">
                        <i class="fa-solid fa-arrow-left me-1"></i> Volver
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-check me-1"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

</main>
<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>
</body>
</html>
