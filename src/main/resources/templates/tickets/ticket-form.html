<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('Editar descuento de entrada — Only Film')}"></head>
<body class="bg-light">
<nav th:replace="~{layout/navbar :: navbar}"></nav>
<main class="container my-4" style="max-width: 720px">
    <div class="card shadow border-0">
        <div class="card-header bg-primary text-white"><h4 class="mb-0">Editar descuento de entrada libre</h4></div>
        <div class="card-body p-4">
            <p class="text-secondary">Los asientos, la sesión, el precio, el estado y el código QR se gestionan desde el inventario y el checkout. No se pueden modificar aquí.</p>
            <dl class="row" th:if="${ticketDetails != null}">
                <dt class="col-sm-4">Butaca</dt>
                <dd class="col-sm-8" th:text="${ticketDetails.row + '-' + ticketDetails.seat}"></dd>
                <dt class="col-sm-4">Precio</dt>
                <dd class="col-sm-8" th:text="${ticketDetails.price}"></dd>
                <dt class="col-sm-4">Estado</dt>
                <dd class="col-sm-8" th:text="${ticketDetails.status}"></dd>
            </dl>
            <form th:action="@{/tickets/save}" th:object="${ticket}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="mb-3">
                    <label for="discount" class="form-label">Descuento (€)</label>
                    <input id="discount" type="number" step="0.01" min="0" class="form-control"
                           th:classappend="${#fields.hasErrors('discount')} ? ' is-invalid' : ''"
                           th:field="*{discount}" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('discount')}" th:errors="*{discount}"></div>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/tickets}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar descuento</button>
                </div>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{layout/footer :: footer}"></footer>
<div th:replace="~{layout/footer :: scripts}"></div>
</body>
</html>
