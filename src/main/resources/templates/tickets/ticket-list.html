<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/head :: head('Entradas — Only Films')}"><title>Entradas — Only Films</title></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout/navbar :: navbar}"></nav>

<main class="container flex-grow-1 my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-0"><i class="fa-solid fa-ticket-simple me-2 text-gold" aria-hidden="true" title="Tickets"></i><span th:text="${title}">Entradas</span></h1>
            <p class="text-muted small mb-0" th:text="${isAdmin} ? 'Gestión de todas las entradas compradas' : 'Gestiona tus entradas y reservas'">Subtítulo</p>
        </div>
        <span class="badge bg-primary rounded-pill px-3 py-2" th:text="|${tickets.size()} tickets|">0 resultados</span>
    </div>

    <div th:if="${tickets.isEmpty()}" class="alert alert-info shadow-sm text-center py-5">
        <i class="fa-solid fa-circle-info fa-3x mb-3"></i>
        <p class="fs-5" th:text="${isAdmin} ? 'Todavía no hay entradas vendidas.' : 'Aún no tienes tickets comprados.'">Sin entradas</p>
        <a th:if="${!isAdmin}" th:href="@{/movies}" class="btn btn-primary btn-sm-custom">Ir a la cartelera</a>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="ticket : ${tickets}">
            <div class="card h-100 shadow-sm border-0 overflow-hidden">
                <div class="position-relative">
                    <img th:src="${ticket.session.movie.imageUrl}"
                         class="card-img-top"
                         alt="Póster"
                         style="height: 220px; object-fit: cover; display:block; width:100%;">
                    <span class="position-absolute top-0 end-0 m-3 badge bg-dark opacity-75 fs-6">
                        [[${#numbers.formatCurrency(ticket.price)}]]
                    </span>
                </div>

                <div class="card-body">
                    <h5 class="card-title text-truncate" th:text="${ticket.session.movie.title}">Título Película</h5>

                    <!-- Comprador: solo visible para admin -->
                    <div th:if="${isAdmin and ticket.user != null}" class="mb-2">
                        <small class="text-muted">
                            <i class="fa-regular fa-user me-1" aria-hidden="true"></i>
                            <span th:text="${ticket.user.firstName + ' ' + ticket.user.lastName + ' (' + ticket.user.username + ')'}"></span>
                        </small>
                    </div>

                  <div class="d-flex gap-2 mb-3">
                        <span class="badge" style="background-color:#ffffff; color:#000000; border:1px solid #C8A96B; padding:0.25rem 0.6rem; border-radius:0.45rem; display:inline-flex; align-items:center; gap:0.4rem;">
                            <i class="fa-solid fa-chair" aria-hidden="true" title="Fila" style="color:#000000; font-size:0.95rem;"></i>
                            <span class="small">Fila: [[${ticket.row}]]</span>
                        </span>

                        <span class="badge" style="background-color:#ffffff; color:#000000; border:1px solid #C8A96B; padding:0.25rem 0.6rem; border-radius:0.45rem; display:inline-flex; align-items:center; gap:0.4rem;">
                            <i class="fa-solid fa-user-tag" aria-hidden="true" title="Asiento" style="color:#000000; font-size:0.95rem;"></i>
                            <span class="small">Asiento: [[${ticket.seat}]]</span>
                        </span>
                    </div>

                    <div class="small text-muted mb-3">
                        <div class="mb-1">
                            <i class="fa-regular fa-calendar-days me-1" aria-hidden="true"></i>
                            <span th:text="${#temporals.format(ticket.session.startTime, 'dd/MM/yyyy')}">01/01/2024</span>
                        </div>
                        <div>
                            <i class="fa-regular fa-clock me-1" aria-hidden="true"></i>
                            <span th:text="${#temporals.format(ticket.session.startTime, 'HH:mm')}">20:00</span>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <span th:classappend="${ticket.status.name() == 'LIBRE' ? 'badge bg-success' :
                                          (ticket.status.name() == 'PAGADO' ? 'badge bg-info' : 'badge bg-warning')}"
                              th:text="${ticket.status}">Estado</span>

                        <small class="text-muted" th:text="${ticket.session.room.name}">Sala 1</small>
                    </div>
                </div>

                <div class="card-footer border-top-0 pb-3 bg-transparent">
                    <a th:href="@{/tickets/{id}(id=${ticket.id})}"
                       class="btn btn-outline-primary w-100 btn-sm-custom d-flex align-items-center justify-content-center">
                        <i class="fa-solid fa-qrcode me-1" aria-hidden="true"></i>
                        <span>Detalles del Ticket</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
<div th:replace="~{layout/footer :: scripts}"></div>

</body>
</html>
