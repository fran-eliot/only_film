<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/head :: head('Recurso no encontrado')}"><title>Recurso no encontrado</title></head>

<body class="d-flex flex-column min-vh-100">

<main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">

    <section class="container">

        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">

                <div class="card text-center p-4 p-md-5">

                    <!-- Badge superior -->
                    <div class="mb-4">
                        <span class="badge badge-secondary px-4 py-3">
                            <i class="fa-solid fa-triangle-exclamation icon-gold me-2"></i>
                            Error 404
                        </span>
                    </div>

                    <!-- Título -->
                    <h1 class="mb-4">
                        <i class="fa-solid fa-film text-gold me-3"></i>
                        Recurso no encontrado
                    </h1>

                    <!-- Mensaje dinámico -->
                    <div class="mb-4">
                        <p class="lead text-secondary mb-0"
                           th:if="${message}"
                           th:text="${message}">
                        </p>

                        <p class="lead text-secondary mb-0"
                           th:unless="${message}">
                            El contenido que intentas visualizar no existe o ya no está disponible.
                        </p>
                    </div>

                    <!-- Botones -->
                    <div class="d-flex flex-column flex-sm-row justify-content-center gap-3 mt-3">

                        <a href="/movies" class="btn btn-secondary">
                            <i class="fa-solid fa-house me-2"></i>
                            Volver al inicio
                        </a>

                    </div>

                </div>

            </div>
        </div>

    </section>

</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>

</body>
</html>
