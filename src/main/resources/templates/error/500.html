<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/head :: head('Problemas internos')}"><title>Problemas internos</title></head>

<body class="d-flex flex-column min-vh-100">

<main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">

    <section class="container">

        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">

                <div class="card text-center p-4 p-md-5">

                    <!-- Badge -->
                    <div class="mb-4">
                        <span class="badge badge-secondary px-4 py-3">
                            <i class="fa-solid fa-bug icon-gold me-2"></i>
                            Error interno
                        </span>
                    </div>

                    <!-- Icono principal -->
                    <div class="mb-4">
                        <i class="fa-solid fa-triangle-exclamation text-gold"
                           style="font-size: 4rem;"></i>
                    </div>

                    <!-- Título -->
                    <h1 class="mb-4">
                        No se ha podido procesar la solicitud
                    </h1>

                    <!-- Descripción -->
                    <div class="mb-4">

                        <p class="lead text-secondary mb-0">
                            Parece que se ha producido un problema interno durante el procesamiento de la petición.
                        </p>

                        <p class="text-secondary mt-3 mb-0">
                            Tal vez exista una variable mal nombrada, una configuración incorrecta
                            o algún error inesperado en la aplicación.
                        </p>

                    </div>

                    <!-- Botón -->
                    <div class="d-flex justify-content-center mt-4">

                        <a href="/movies" class="btn btn-primary">
                            <i class="fa-solid fa-film me-2"></i>
                            Volver a películas disponibles
                        </a>

                    </div>

                </div>

            </div>
        </div>

    </section>

</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>

</body>
</html>
