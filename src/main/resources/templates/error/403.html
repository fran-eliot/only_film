<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/head :: head('Acceso no permitido')}"><title>Acceso no permitido</title></head>

<body class="d-flex flex-column min-vh-100">

<main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">

    <section class="container">

        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">

                <div class="card text-center p-4 p-md-5">

                    <!-- Badge -->
                    <div class="mb-4">
                        <span class="badge badge-secondary px-4 py-3">
                            <i class="fa-solid fa-lock icon-gold me-2"></i>
                            Acceso restringido
                        </span>
                    </div>

                    <!-- Icono principal -->
                    <div class="mb-4">
                        <i class="fa-solid fa-user-secret text-gold"
                           style="font-size: 4rem;"></i>
                    </div>

                    <!-- Título -->
                    <h1 class="mb-4">
                        Upss, no deberías estar por aquí...
                    </h1>

                    <!-- Mensaje -->
                    <div class="mb-4">

                        <p class="lead text-secondary mb-0"
                           th:if="${message}"
                           th:text="${message}">
                        </p>

                        <p class="lead text-secondary mb-0"
                           th:unless="${message}">
                            Parece que intentaste acceder a una sección reservada del sistema.
                        </p>

                    </div>

                    <!-- Botones -->
                    <div class="d-flex flex-column flex-sm-row justify-content-center gap-3 mt-4">

                        <a href="/movies" class="btn btn-primary">
                            <i class="fa-solid fa-film me-2"></i>
                            Volver a películas disponibles
                        </a>

                        <a href="/" class="btn btn-secondary">
                            <i class="fa-solid fa-house me-2"></i>
                            Ir al inicio
                        </a>

                    </div>

                </div>

            </div>
        </div>

    </section>

</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>

</body>
</html>
