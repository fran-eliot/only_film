<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/head :: head('No encontrado')}"><title>No encontrado</title></head>

<body class="d-flex flex-column min-vh-100">

<main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">

    <section class="container">

        <div class="row justify-content-center">
            <div class="col-lg-7 col-md-9">

                <div class="card text-center p-4 p-md-5">

                    <div class="mb-4">

                        <div class="mb-4">
                            <span class="badge badge-secondary px-4 py-3">
                                <i class="fa-solid fa-film icon-gold me-2"></i>
                                Error de catálogo
                            </span>
                        </div>

                        <h1 class="mb-3">
                            <i class="fa-solid fa-utensils text-gold me-3"></i>
                            No se ha encontrado
                        </h1>

                        <p class="lead text-secondary mb-4">
                            La película que buscas no está disponible o ha sido retirada del catálogo.
                        </p>

                    </div>

                    <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">

                        <a href="/movies" class="btn btn-primary">
                            <i class="fa-solid fa-film me-2"></i>
                            Ver películas disponibles
                        </a>

                        <a href="/" class="btn btn-secondary">
                            <i class="fa-solid fa-house me-2"></i>
                            Volver al inicio
                        </a>

                    </div>

                </div>

            </div>
        </div>

    </section>

</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>

</body>
</html>
