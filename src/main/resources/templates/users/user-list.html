<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('Listado Usuarios — Only Film')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{layout/navbar :: navbar}"></nav>
<main class="container flex-grow-1 my-4">
    <div class="row">
        <div class="col-md-8">
            <h1 class="mb-0">
                <i class="fa-solid fa-users text-gold me-2" aria-hidden="true"></i>
                Usuarios
            </h1>
            <p class="text-muted small mb-0">Gestiona los usuarios del sistema</p>
        </div>

        <div class="col-md-4 d-md-flex justify-content-md-end align-self-center">
            <a th:href="@{/admin/users/new}" class="btn btn-primary btn-sm">
                <i class="fa-solid fa-user-plus me-1" aria-hidden="true"></i>
                Crear usuario
            </a>
        </div>

    </div>

    <div th:if="${message}" class="alert alert-success mt-3" th:text="${message}"></div>
    <div th:if="${error}"   class="alert alert-danger  mt-3" th:text="${error}"></div>

    <div class="table-responsive mt-4">
        <table class="table table-dark table-hover align-middle border-gold w-100">
            <thead>
            <tr>
                <th>Id</th>
                <th>Username</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Activo</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.username}"></td>
                <td th:text="${user.email}"></td>
                <td th:text="${user.role}"></td>
                <td>
                    <span class="badge bg-success" th:if="${user.active}">Sí</span>
                    <span class="badge bg-danger" th:unless="${user.active}">No</span>
                </td>
                <td>
                    <div class="d-flex gap-1 flex-wrap">
                        <a th:href="@{/admin/users/{id}(id=${user.id})}"
                           class="btn btn-sm btn-outline-primary" title="Ver">
                            <i class="fa-solid fa-eye me-1" aria-hidden="true"></i> Ver
                        </a>
                        <a th:href="@{/admin/users/edit/{id}(id=${user.id})}"
                           class="btn btn-sm btn-outline-primary" title="Editar">
                            <i class="fa-solid fa-user-pen me-1" aria-hidden="true"></i> Editar
                        </a>
                        <form method="post" th:action="@{/admin/users/deactivate/{id}(id=${user.id})}" th:if="${user.active == true and user.role.name() != 'ROLE_ADMIN'}" class="d-inline"><button type="submit" class="btn btn-sm btn-danger equal-btn" title="Desactivar">
                            <i class="fa-solid fa-user-slash me-1" aria-hidden="true"></i> Desactivar
                        </button></form>
                        <form method="post" th:action="@{/admin/users/activate/{id}(id=${user.id})}" th:if="${!user.active}" class="d-inline"><button type="submit" class="btn btn-sm btn-success equal-btn" title="Activar">
                            <i class="fa-solid fa-user-check me-1" aria-hidden="true"></i> Activar
                        </button></form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>
</body>
</html>
<style>
    .equal-btn {
        min-width: 174px;
        text-align: center;
    }

</style>
