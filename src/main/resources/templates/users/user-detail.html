<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/head :: head('Detalle Usuario — Only Film')}"><title>Detalle Usuario — Only Film</title></head>

<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout/navbar :: navbar}"></nav>

<main class="container flex-grow-1 my-4">

    <h1 class="mb-3">
        <i class="fa-solid fa-user text-gold me-2" aria-hidden="true"></i>
        <span th:text="${'Usuario: ' + user.id}"></span>
    </h1>

    <div class="card shadow-sm border-0 rounded-3 overflow-hidden mb-4">

        <div class="card-body d-flex align-items-center gap-4 flex-wrap">

            <dl class="row mb-0 flex-grow-1">
                <dt class="col-sm-3">ID</dt>
                <dd class="col-sm-9" th:text="${user.id}"></dd>
                <dt class="col-sm-3">Username</dt>
                <dd class="col-sm-9" th:text="${user.username}"></dd>
                <dt class="col-sm-3">Email</dt>
                <dd class="col-sm-9" th:text="${user.email}"></dd>
                <dt class="col-sm-3">Rol</dt>
                <dd class="col-sm-9" th:text="${user.role}"></dd>
            </dl>

            <img th:if="${user.imageUrl != null}" th:src="${user.imageUrl}"
                 class="rounded-circle"
                 style="width:150px; height:150px; object-fit:cover; flex-shrink:0;"
                 alt="Foto perfil">

        </div>
        <div class="card-footer bg-transparent border-top d-flex gap-2 justify-content-end">
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}" class="btn btn-sm btn-outline-primary">
                <i class="fa-solid fa-arrow-left me-1" aria-hidden="true"></i> Volver
            </a>

            <a sec:authorize="isAuthenticated()"
               th:if="${#authentication.principal.id == user.id}"
               th:href="@{/profile/edit}" class="btn btn-sm btn-outline-success">
                <i class="fa-solid fa-user-pen me-1"></i> Editar mi perfil
            </a>

            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-outline-primary">
                <i class="fa-solid fa-user-pen me-1" aria-hidden="true"></i> Editar
            </a>
            <form method="post" th:action="@{/admin/users/deactivate/{id}(id=${user.id})}" th:if="${user.active and user.role.name() != 'ROLE_ADMIN'}" class="d-inline"><button type="submit" class="btn btn-sm btn-danger">
                <i class="fa-solid fa-user-slash me-1" aria-hidden="true"></i> Desactivar
            </button></form>
            <form method="post" th:action="@{/admin/users/activate/{id}(id=${user.id})}" th:if="${!user.active}" class="d-inline"><button type="submit" class="btn btn-sm btn-success">
                <i class="fa-solid fa-user-check me-1" aria-hidden="true"></i> Activar
            </button></form>
        </div>

    </div>

    <!-- ENTRADAS COMPRADAS -->
    <div class="mb-5">
        <h3 class="mb-4">
            <i class="fa-solid fa-ticket text-gold me-2"></i>
            Entradas compradas
            <span class="badge badge-secondary ms-2 align-middle" th:text="${#lists.size(userStats.tickets())}">0</span>
        </h3>

        <div th:if="${#lists.isEmpty(userStats.tickets())}" class="alert alert-info border">
            <i class="fa-solid fa-info-circle me-2"></i>
            Este usuario no ha comprado ninguna entrada todavía.
        </div>

        <div th:if="${!#lists.isEmpty(userStats.tickets())}" class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-dark mb-0">
                        <thead>
                            <tr>
                                <th><i class="fa-solid fa-hashtag me-1"></i>ID</th>
                                <th><i class="fa-solid fa-film me-1"></i>Película</th>
                                <th><i class="fa-solid fa-calendar me-1"></i>Fecha sesión</th>
                                <th><i class="fa-solid fa-door-open me-1"></i>Sala</th>
                                <th><i class="fa-solid fa-couch me-1"></i>Butaca</th>
                                <th><i class="fa-solid fa-euro-sign me-1"></i>Total</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="ticket : ${userStats.tickets()}">
                                <td class="align-middle">
                                    <span class="badge bg-primary" th:text="${ticket.id}"></span>
                                </td>
                                <td class="align-middle text-secondary" th:text="${ticket.session.movie.title}"></td>
                                <td class="align-middle text-secondary"
                                    th:text="${#temporals.format(ticket.session.startTime, 'dd/MM/yyyy HH:mm')}"></td>
                                <td class="align-middle text-secondary" th:text="${ticket.session.room.name}"></td>
                                <td class="align-middle">
                                    <span class="badge badge-secondary">
                                        Fila <span th:text="${ticket.row}"></span>
                                        &nbsp;Butaca <span th:text="${ticket.seat}"></span>
                                    </span>
                                </td>
                                <td class="align-middle">
                                    <span class="text-gold fw-bold"
                                          th:text="${#numbers.formatDecimal(ticket.price + (ticket.snackPrice != null ? ticket.snackPrice : 0), 1, 2) + ' €'}"></span>
                                </td>
                                <td class="align-middle text-end">
                                    <a th:href="@{/tickets/{id}(id=${ticket.id})}" class="btn btn-sm btn-outline-light">
                                        <i class="fa-solid fa-eye"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- RESEÑAS ESCRITAS -->
    <div class="mb-5">
        <h3 class="mb-4">
            <i class="fa-regular fa-comments text-gold me-2"></i>
            Reseñas escritas
            <span class="badge badge-secondary ms-2 align-middle" th:text="${userStats.countReviews()}">0</span>
        </h3>

        <div th:if="${#lists.isEmpty(userStats.reviews())}" class="alert alert-info border">
            <i class="fa-solid fa-info-circle me-2"></i>
            Este usuario no ha escrito ninguna reseña todavía.
        </div>

        <div th:if="${!#lists.isEmpty(userStats.reviews())}" class="row row-cols-1 row-cols-md-2 g-3">
            <div class="col" th:each="review : ${userStats.reviews()}">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h6 class="card-title mb-0" th:text="${review.title}">Título</h6>
                            <span class="badge" style="background-color:#C8A96B; color:#0B0B0D; padding:0.3rem 0.6rem; border-radius:0.4rem; white-space:nowrap;">
                                <i class="fa-solid fa-star me-1"></i>
                                <span th:text="${review.rating + ' / 5'}"></span>
                            </span>
                        </div>
                        <p class="card-text text-muted small mb-2" th:text="${review.description}">Descripción</p>
                        <div th:if="${review.movie != null}" class="small">
                            <i class="fa-solid fa-film text-gold me-1"></i>
                            <a th:href="@{/movies/{id}(id=${review.movie.id})}"
                               th:text="${review.movie.title}"
                               class="text-gold text-decoration-none"></a>
                        </div>
                    </div>
                    <div class="card-footer bg-transparent border-top small d-flex justify-content-between align-items-center pt-2">
                        <span class="text-muted">
                            <i class="fa-regular fa-calendar me-1"></i>
                            <span th:text="${#temporals.format(review.creationDate, 'dd/MM/yyyy')}"></span>
                        </span>
                        <a class="btn btn-sm btn-outline-light" th:href="@{/reviews/{id}(id=${review.id})}">
                            <i class="fa-solid fa-eye me-1"></i> Ver
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</main>
<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>

</body>
</html>
