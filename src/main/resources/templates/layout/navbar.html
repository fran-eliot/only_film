<!DOCTYPE html>

<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg mb-4" aria-label="Navegación principal">
    <div class="container">
        <!-- Logo -->
        <a class="navbar-brand d-flex align-items-center" th:href="@{/movies}">
            <img th:src="@{/images/OnlyFilm.png}"
            alt="Only Film"
            class="me-2">
        </a>

        <!-- Botón móvil -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNav"
                aria-controls="mainNav"
                aria-expanded="false"
                aria-label="Abrir menú de navegación">

            <span class="navbar-toggler-icon"></span>

        </button>

        <!-- Navegación -->
        <div class="collapse navbar-collapse" id="mainNav">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/movies}">
                        <i class="fa-solid fa-film me-2" aria-hidden="true"></i>
                        Cartelera
                    </a>
                </li>

                <li sec:authorize="hasRole('ADMIN')" class="nav-item">
                    <a class="nav-link" th:href="@{/sessions}">
                        <i class="fa-solid fa-video me-2" aria-hidden="true"></i>
                        Proyecciones
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/tickets}">
                        <i class="fa-solid fa-ticket me-2" aria-hidden="true"></i>
                        Entradas
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/reviews}">
                        <i class="fa-regular fa-comments me-2" aria-hidden="true"></i>
                        Experiencias
                    </a>
                </li>

                <li sec:authorize="hasRole('ADMIN')" class="nav-item">
                    <a class="nav-link" th:href="@{/salas}">
                        <i class="fa-solid fa-tv me-2" aria-hidden="true"></i>
                        Salas
                    </a>
                </li>

                <li sec:authorize="hasRole('ADMIN')" class="nav-item">
                    <a class="nav-link" th:href="@{/admin/users}">
                        <i class="fa-solid fa-users me-2" aria-hidden="true"></i>
                        Usuarios
                    </a>
                </li>

            </ul>

            <!-- Zona de autenticación -->
            <div class="d-flex align-items-center gap-2">

                <!-- Usuario NO autenticado -->
                <th:block sec:authorize="!isAuthenticated()">

                    <a class="btn btn-outline-light"
                       th:href="@{/login}"
                       title="Iniciar sesión">

                        <i class="fa-solid fa-user me-2" aria-hidden="true"></i>
                        Entrar

                    </a>

                    <a class="btn btn-primary"
                       th:href="@{/register}">

                        <i class="fa-solid fa-user-plus me-2" aria-hidden="true"></i>
                        Registrarse

                    </a>

                </th:block>

                <!-- Usuario autenticado -->
                <div sec:authorize="isAuthenticated()"
                     class="dropdown">

                    <button
                            class="btn btn-outline-light d-flex align-items-center gap-2 px-3"
                            type="button"
                            id="profileDropdown"
                            data-bs-toggle="dropdown"
                            aria-expanded="false">

                        <img
                                th:src="${#authentication.principal.imageUrl != null ? #authentication.principal.imageUrl : '/images/avatar.svg'}"
                                alt="Avatar de usuario"
                                class="rounded-circle object-fit-cover"
                                style="width: 36px; height: 36px; border: 2px solid var(--cinema-accent-gold);">

                        <span class="d-none d-sm-inline fw-semibold text-light">
                        Hola,
                        <span sec:authentication="name"></span>
                    </span>

                    </button>

                    <ul class="dropdown-menu dropdown-menu-end"
                        aria-labelledby="profileDropdown">

                        <li>
                            <a class="dropdown-item"
                               th:href="@{/profile}">
                                <i class="fa-solid fa-user me-2" aria-hidden="true"></i>
                                Mi Perfil
                            </a>
                        </li>

                        <li>
                            <hr class="dropdown-divider">
                        </li>

                        <li>
                            <form th:action="@{/logout}"
                                  method="post"
                                  class="d-inline">

                                <button type="submit"
                                        class="dropdown-item">

                                    <i class="fa-solid fa-right-from-bracket me-2 text-danger" aria-hidden="true"></i>
                                    Cerrar Sesión

                                </button>

                            </form>
                        </li>

                    </ul>

                </div>

            </div>

        </div>

    </div>

</nav>

<!-- Efecto scroll navbar -->

<script>
    document.addEventListener('DOMContentLoaded', function () {

        const navbar = document.querySelector('.navbar');

        window.addEventListener('scroll', function () {

            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }

        });

    });
</script>

</body>
</html>
