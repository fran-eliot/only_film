<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('Formulario de reseña — Only Film')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout/navbar :: navbar}"></nav>

<main class="container flex-grow-1 my-4" style="max-width: 680px">

    <h1 class="mb-4">
        <i class="fa-regular fa-comments text-gold me-2" aria-hidden="true"></i>
        <span th:text="${review.id != null ? 'Editar reseña' : 'Nueva reseña'}"></span>
    </h1>

    <!-- Aviso de peli asociada -->
    <div class="alert alert-info my-3" th:if="${movie != null}">
        <i class="fa-solid fa-film me-1" aria-hidden="true"></i>
        Reseña sobre: <strong th:text="${movie.title}"></strong>
    </div>

    <div class="card shadow-sm border-0 rounded-3 overflow-hidden">
        <div class="card-body p-4">
            <form th:action="@{/reviews}" method="post" th:object="${review}" id="reviewForm">

                <!--ID para edicion -->
                <input type="hidden" th:field="*{id}">

                <!-- movieid como campo separado para que el POST lo reciba limpio -->
                <input type="hidden" name="movieId"
                       th:value="${movie != null ? movie.id : ''}">

                <!-- Valor numérico real que se envía al controller -->
                <input type="hidden" id="ratingHidden" name="rating"
                       th:value="${review.rating != null ? review.rating : 0}">

                <div class="mb-3">
                    <label for="title" class="form-label fw-semibold">
                        Título <span class="text-danger">*</span>
                    </label>
                    <input id="title" type="text" class="form-control"
                           th:field="*{title}" required maxlength="255"
                           placeholder="Escribe un título para tu reseña">
                </div>

                <div class="mb-4">
                    <label for="description" class="form-label fw-semibold">
                        Descripción <span class="text-danger">*</span>
                    </label>
                    <textarea id="description" class="form-control" rows="5"
                              th:field="*{description}" required maxlength="1000"
                              placeholder="Cuéntanos qué te ha parecido la película..."></textarea>
                </div>

                <!-- Estrellas -->
                <fieldset class="mb-4">
                    <legend class="form-label fw-semibold">Puntuación <span class="text-danger">*</span></legend>

                    <div class="star-rating d-flex gap-1" id="starRating" aria-describedby="ratingText ratingError">
                        <button type="button" class="rating-star" data-value="1" aria-label="1 estrella" aria-pressed="false"><i class="fa-regular fa-star" aria-hidden="true"></i></button>
                        <button type="button" class="rating-star" data-value="2" aria-label="2 estrellas" aria-pressed="false"><i class="fa-regular fa-star" aria-hidden="true"></i></button>
                        <button type="button" class="rating-star" data-value="3" aria-label="3 estrellas" aria-pressed="false"><i class="fa-regular fa-star" aria-hidden="true"></i></button>
                        <button type="button" class="rating-star" data-value="4" aria-label="4 estrellas" aria-pressed="false"><i class="fa-regular fa-star" aria-hidden="true"></i></button>
                        <button type="button" class="rating-star" data-value="5" aria-label="5 estrellas" aria-pressed="false"><i class="fa-regular fa-star" aria-hidden="true"></i></button>
                    </div>

                    <small class="text-muted mt-1 d-block" id="ratingText">Selecciona una puntuación</small>
                    <div class="text-danger small mt-1" id="ratingError" role="alert" style="display:none">
                        <i class="fa-solid fa-circle-exclamation me-1" aria-hidden="true"></i>Por favor selecciona una puntuación.
                    </div>
                </fieldset>

                <div class="d-flex gap-2 flex-wrap">
                    <button id="submitReviewBtn" type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-floppy-disk me-1" aria-hidden="true"></i> Guardar
                    </button>
                    <a th:if="${movie != null}" class="btn btn-outline-primary"
                       th:href="@{/movies/{id}(id=${movie.id})}">
                        <i class="fa-solid fa-times me-1" aria-hidden="true"></i> Cancelar
                    </a>
                    <a th:if="${movie == null}" class="btn btn-outline-primary"
                       th:href="@{/reviews}">
                        <i class="fa-solid fa-times me-1" aria-hidden="true"></i> Cancelar
                    </a>
                </div>

            </form>
        </div>
    </div>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>

<style>
    .star-rating .rating-star {
        background: transparent;
        border: 0;
        padding: 0.25rem;
        line-height: 1;
    }
    .star-rating .rating-star:focus-visible {
        outline: 2px solid var(--cinema-accent-gold);
        outline-offset: 3px;
    }
    .star-rating .rating-star i {
        font-size: 1.8rem;
        color: var(--cinema-text-secondary);
        cursor: pointer;
        transition: color 0.1s ease, transform 0.1s ease;
    }
    .star-rating .rating-star i.filled {
        color: var(--cinema-accent-gold);
        font-weight: 700;
    }
    .star-rating .rating-star:hover i {
        transform: scale(1.15);
        color: var(--cinema-accent-gold);
    }
</style>

<script th:replace="~{layout/footer :: scripts}"></script>

<script>
    const stars      = document.querySelectorAll('#starRating .rating-star');
    const hidden     = document.getElementById('ratingHidden');
    const ratingText = document.getElementById('ratingText');
    const ratingError= document.getElementById('ratingError');

    const labels = ['', 'Muy mala', 'Floja', 'Está bien', 'Muy buena', 'Maravillosa'];

    let selected = Number.parseInt(hidden.value, 10) || 0;

    function paintStars(upTo) {
        stars.forEach((s, i) => {
            if (i < upTo) {
                s.querySelector('i').classList.replace('fa-regular', 'fa-solid');
                s.querySelector('i').classList.add('filled');
            } else {
                s.querySelector('i').classList.replace('fa-solid', 'fa-regular');
                s.querySelector('i').classList.remove('filled');
            }
        });
    }

    // Pintar estado inicial si venimos de edición
    paintStars(selected);
    stars.forEach(star => star.setAttribute('aria-pressed', String(Number(star.dataset.value) === selected)));
    if (selected > 0) ratingText.textContent = selected + ' / 5 — ' + labels[selected];

    function chooseRating(val) {
        selected = val;
        hidden.value = val;
        ratingError.style.display = 'none';
        stars.forEach(star => star.setAttribute('aria-pressed', String(Number(star.dataset.value) === val)));
        paintStars(selected);
        ratingText.textContent = selected + ' / 5 — ' + labels[selected];
    }

    stars.forEach(star => {
        const val = Number.parseInt(star.dataset.value, 10);

        // Hover: iluminar hasta aquí
        star.addEventListener('mouseenter', () => {
            paintStars(val);
            ratingText.textContent = val + ' / 5 — ' + labels[val];
        });

        // Al salir: volver a la selección fija
        star.addEventListener('mouseleave', () => {
            paintStars(selected);
            ratingText.textContent = selected > 0
                ? selected + ' / 5 — ' + labels[selected]
                : 'Selecciona una puntuación';
        });

        // Las flechas desplazan el foco; Espacio o Intro confirman la puntuación.
        star.addEventListener('keydown', event => {
            const index = Array.from(stars).indexOf(star);
            let nextIndex;
            switch (event.key) {
                case 'ArrowRight':
                    nextIndex = (index + 1) % stars.length;
                    break;
                case 'ArrowLeft':
                    nextIndex = (index - 1 + stars.length) % stars.length;
                    break;
                case 'Home':
                    nextIndex = 0;
                    break;
                case 'End':
                    nextIndex = stars.length - 1;
                    break;
                default:
                    return;
            }
            event.preventDefault();
            stars[nextIndex].focus();
        });

        star.addEventListener('click', () => chooseRating(val));
    });

    // Validación al enviar
    document.getElementById('reviewForm').addEventListener('submit', e => {
        if (selected < 1) {
            e.preventDefault();
            ratingError.style.display = 'block';
            stars[0].focus();
        }
    });
</script>

</body>
</html>
