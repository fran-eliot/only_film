<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/head :: head('Detalle de reseña — Only Film')}"><title>Detalle de reseña — Only Film</title></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout/navbar :: navbar}"></nav>

<main class="container flex-grow-1 my-5" style="max-width: 720px">

    <div class="card shadow border-0 rounded-3 overflow-hidden">

        <!-- Cabecera con la peli y puntuación -->
        <div class="card-header py-3 px-4 d-flex align-items-center justify-content-between" style="background-color:var(--cinema-surface-2); border-bottom:1px solid var(--cinema-accent-gold);">
            <div class="d-flex align-items-center gap-3" th:if="${review.movie != null}">
                <i class="fa-solid fa-film fs-5 text-gold" aria-hidden="true"></i>
                <div>
                    <p class="mb-0 small text-muted">Película reseñada</p>
                    <a th:href="@{/movies/{id}(id=${review.movie.id})}"
                       th:text="${review.movie.title}"
                       class="text-gold fw-semibold text-decoration-none fs-6"></a>
                </div>
            </div>
            <div th:if="${review.movie == null}" class="text-muted small">Sin película asociada</div>

            <!-- Estrellas -->
            <div class="d-flex align-items-center gap-2">
                <div>
                    <span th:each="i : ${#numbers.sequence(1, 5)}">
                        <i th:class="${i <= review.rating ? 'fa-solid fa-star' : 'fa-regular fa-star'}"
                           style="color:var(--cinema-accent-gold);"
                           aria-hidden="true"></i>
                    </span>
                </div>
                <span class="badge" style="background-color:var(--cinema-accent-gold); color:var(--cinema-dark); font-weight:700; font-size:0.85rem; padding:0.35rem 0.6rem;" th:text="${review.rating + '/5'}"></span>
            </div>
        </div>

        <div class="card-body px-4 py-4">

            <!-- Título -->
            <h2 class="fw-bold mb-1 fs-4" th:text="${review.title}">Título de la reseña</h2>

            <!-- Autor y fecha -->
            <div class="d-flex align-items-center gap-3 mb-4 text-muted small">
                <span>
                    <i class="fa-regular fa-user me-1" aria-hidden="true"></i>
                    <span th:if="${review.user != null}" th:text="${review.user.firstName + ' ' + review.user.lastName}">Autor</span>
                    <span th:if="${review.user == null}">Anónimo</span>
                </span>
                <span>·</span>
                <span>
                    <i class="fa-regular fa-calendar me-1" aria-hidden="true"></i>
                    <span th:text="${#temporals.format(review.creationDate, 'dd/MM/yyyy HH:mm')}"></span>
                </span>
            </div>

            <!-- Descripción -->
            <p class="card-text lh-lg" th:text="${review.description}">Descripción de la reseña.</p>

        </div>

        <!-- Acciones -->
        <div class="card-footer bg-transparent border-top small px-4 pb-4 d-flex gap-2 flex-wrap">

            <!-- Volver -->
            <a th:href="${returnUrl != null ? returnUrl : '/reviews'}" class="btn btn-sm btn-outline-primary mt-2">
                <i class="fa-solid fa-arrow-left me-1" aria-hidden="true"></i> Volver
            </a>

            <!-- Editar: solo el propio autor -->
            <div sec:authorize="hasRole('USER')" class="mt-2">
                <a th:if="${review.user != null and review.user.username == #authentication.name}"
                   class="btn btn-sm btn-outline-primary"
                   th:href="@{/reviews/edit/{id}(id=${review.id})}">
                    <i class="fa-solid fa-pencil me-1"></i> Editar
                </a>
            </div>

            <!-- Borrar: solo admin -->
            <form method="post" th:action="@{/reviews/delete/{id}(id=${review.id})}" sec:authorize="hasRole('ADMIN')" class="d-inline" onsubmit="return confirm('¿Seguro que quieres eliminar esta reseña? Esta acción no se puede deshacer.')"><button type="submit" class="btn btn-sm btn-danger ms-auto">
                <i class="fa-solid fa-trash me-1" aria-hidden="true"></i> Eliminar
            </button></form>

        </div>
    </div>

</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>
</body>
</html>
