<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/head :: head('Reseñas — Only Film')}"><title>Reseñas</title></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout/navbar :: navbar}"></nav>

<main class="container flex-grow-1 my-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">
            <i class="fa-regular fa-comments text-gold me-2" aria-hidden="true"></i> Opiniones de clientes
        </h1>
    </div>

    <!-- flash message de borrado -->
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fa-solid fa-check-circle me-1"></i>
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${reviews.isEmpty()}" class="alert alert-info">
        <i class="fa-solid fa-circle-info me-2"></i>
        Aún no hay reseñas.
    </div>

    <div class="row row-cols-1 row-cols-md-2 g-3">
        <div class="col" th:each="review : ${reviews}">
            <div class="card h-100 shadow-sm overflow-hidden">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="card-title mb-0" th:text="${review.title}">Título</h5>
                        <span class="badge" style="background-color:#C8A96B; color:#0B0B0D; padding:0.35rem 0.6rem; border-radius:0.4rem; display:inline-flex; align-items:center; gap:0.3rem; font-size:0.85rem; white-space:nowrap;">
                            <i class="fa-solid fa-star" style="color:#0B0B0D;"></i>
                            <span th:text="${review.rating + ' / 5'}"></span>
                        </span>
                    </div>
                    <p class="card-text text-muted small" th:text="${review.description}">Descripción</p>
                    <p class="text-muted small mb-0">
                        <i class="fa-regular fa-user me-1" aria-hidden="true"></i>
                        <span th:if="${review.user != null}" th:text="${review.user.firstName + ' ' + review.user.lastName}"></span>
                        <span th:if="${review.user == null}">Anónimo</span>
                        <span class="mx-1">·</span>
                        <i class="fa-regular fa-calendar me-1" aria-hidden="true"></i>
                        <span th:text="${#temporals.format(review.creationDate, 'dd/MM/yyyy')}"></span>
                    </p>
                </div>
                <div class="card-footer bg-transparent border-top small">
                    <div th:if="${review.movie != null}" class="mb-2">
                        <i class="fa-solid fa-film text-gold me-1" aria-hidden="true"></i>
                        <a th:href="@{/movies/{id}(id=${review.movie.id})}"
                           th:text="${review.movie.title}"
                           class="text-gold">Película</a>
                    </div>
                    <div class="d-flex gap-2 flex-wrap">
                        <!-- Ver reseña siempre visible -->
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/reviews/{id}(id=${review.id})}">
                            <i class="fa-solid fa-eye me-1" aria-hidden="true"></i> Ver
                        </a>

                        <!-- Editar: solo el propio autor -->
                        <div sec:authorize="hasRole('USER')">
                            <a th:if="${review.user != null and review.user.username == #authentication.name}"
                               class="btn btn-sm btn-outline-primary"
                               th:href="@{/reviews/edit/{id}(id=${review.id})}">
                                <i class="fa-solid fa-pencil me-1" aria-hidden="true"></i> Editar
                            </a>
                        </div>

                        <!-- Borrar: solo admin -->
                        <form method="post" th:action="@{/reviews/delete/{id}(id=${review.id})}" sec:authorize="hasRole('ADMIN')" class="d-inline" onsubmit="return confirm('¿Seguro que quieres borrar esta reseña?')"><button type="submit" class="btn btn-sm btn-danger">
                            <i class="fa-solid fa-trash me-1" aria-hidden="true"></i> Borrar
                        </button></form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>
</body>
</html>
