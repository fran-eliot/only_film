<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('Iniciar sesión')}"></head>
<body class="d-flex align-items-center py-4 min-vh-100 login-container">

<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <form th:action="@{/login}" method="post" class="card shadow-sm p-4">

                <div class="text-center mb-3">
                    <h1 class="h3 mt-3 fw-normal">Ingresa con tu cuenta</h1>
                </div>

                <div th:if="${param.error}" class="alert alert-danger" role="alert">Credenciales incorrectas.</div>
                <output th:if="${param.logout}" class="alert alert-success d-block">Sesión cerrada correctamente, hasta pronto.</output>
                <output th:if="${message}" class="alert alert-success d-block" th:text="${message}"></output>

                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username" name="username"
                           required minlength="3" maxlength="100">
                    <label for="username">Username</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="password" name="password"
                           class="form-control" id="password"
                           required minlength="4">
                    <label for="password">Contraseña</label>
                </div>

                <button type="submit" class="btn btn-primary">Entrar</button>

                <p class="mt-3 text-center small">¿Aun no te has registrado?
                    <a th:href="@{/register}">Crear cuenta</a>.
                </p>

            </form>
        </div>
    </div>
</main>

<script th:replace="~{layout/footer :: scripts}"></script>
</body>
</html>
