<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('Crear cuenta')}"><title>Crear cuenta</title></head>
<body class="d-flex align-items-center py-4 min-vh-100 login-container">

<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <form th:action="@{/register}" method="post" class="card shadow-sm p-4" th:object="${user}" novalidate>

                <!-- LOGO Y TITULO -->
                <div class="text-center mb-3">
                    <h1 class="h3 mt-3 fw-normal">Crear cuenta</h1>
                </div>

                <!-- ERROR -->
                <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username"
                           placeholder="" required th:field="*{username}" minlength="3" maxlength="20"
                            th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                           th:aria-invalid="${#fields.hasErrors('username')}"
                           th:aria-describedby="${#fields.hasErrors('username') ? 'usernameError' : null}">
                    <label for="username">Username</label>
                    <div id="usernameError" class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>

                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="firstName"
                           placeholder="" required th:field="*{firstName}" minlength="3" maxlength="20"
                           th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'"
                           th:aria-invalid="${#fields.hasErrors('firstName')}"
                           th:aria-describedby="${#fields.hasErrors('firstName') ? 'firstNameError' : null}">
                    <label for="firstName">Nombre</label>
                    <div id="firstNameError" class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                </div>

                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="lastName"
                           placeholder="" required th:field="*{lastName}" minlength="3" maxlength="20"
                           th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'"
                           th:aria-invalid="${#fields.hasErrors('lastName')}"
                           th:aria-describedby="${#fields.hasErrors('lastName') ? 'lastNameError' : null}">
                    <label for="lastName">Apellido</label>
                    <div id="lastNameError" class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                </div>


                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email"
                           placeholder="" required th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                           th:aria-invalid="${#fields.hasErrors('email')}"
                           th:aria-describedby="${#fields.hasErrors('email') ? 'emailError' : null}">
                    <label for="email">Email</label>
                    <div id="emailError" class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="form-floating mb-3">
                    <input type="password" th:field="*{password}"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                           th:aria-invalid="${#fields.hasErrors('password')}"
                           th:aria-describedby="${#fields.hasErrors('password') ? 'passwordError' : null}"
                           class="form-control" id="password" required minlength="4" maxlength="100">
                    <label for="password">Contraseña</label>
                    <div id="passwordError" class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="form-floating mb-3">
                    <input type="password" th:field="*{passwordConfirm}"
                           th:classappend="${#fields.hasErrors('passwordConfirm')} ? 'is-invalid'"
                           th:aria-invalid="${#fields.hasErrors('passwordConfirm')}"
                           th:aria-describedby="${#fields.hasErrors('passwordConfirm') ? 'passwordConfirmError' : null}"
                           class="form-control" id="passwordConfirm" required minlength="4" maxlength="40">
                    <label for="passwordConfirm">Repite la contraseña</label>
                    <div id="passwordConfirmError" class="invalid-feedback" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></div>
                </div>

                <button type="submit" class="btn btn-primary">Crear cuenta</button>

                <p class="mt-3 text-center small">¿Ya tienes cuenta?
                    <a th:href="@{/login}">Inicia sesión</a>.
                </p>

            </form>
        </div>
    </div>
</main>

<script th:replace="~{layout/footer :: scripts}"></script>
</body>
</html>
